name: Build NotchNote
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Self-tests
        run: ./scripts/selftest.sh
      - name: Build
        run: |
          set -o pipefail
          CONFIG=Release ./scripts/build.sh 2>&1 | tee build.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|warning: unable|fatal" build.log | sort -u | head -40 | while IFS= read -r l; do
            echo "::error::$(echo "$l" | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | cut -c1-400)"
          done
          tail -25 build.log | while IFS= read -r l; do echo "::warning::$(echo "$l" | cut -c1-300)"; done
      - name: Package
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/NotchNote.app
          ditto -c -k --keepParent build/Build/Products/Release/NotchNote.app NotchNote-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NotchNote-app
          path: NotchNote-app.zip
      - name: Publish a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Update NotchNote.command" Update-NotchNote.command
          cat > notes.md <<'NOTES'
          ## Install (first time)
          1. Download **NotchNote-app.zip** below and double-click it to unzip.
          2. Drag **NotchNote.app** into your **Applications** folder.
          3. Right-click NotchNote in Applications, choose **Open**, then **Open** again (only the first time).

          ## Update (later)
          Download **Update-NotchNote.command** below and double-click it (first time: right-click, Open).
          It closes NotchNote, installs the newest version and reopens it. Your notes are kept.

          Or do it by hand: quit NotchNote from its menu-bar icon, download the new zip, and drag the new app into Applications, replacing the old one.
          NOTES
          gh release create "build-${{ github.run_number }}" NotchNote-app.zip Update-NotchNote.command \
            --latest \
            --title "NotchNote 1.0 (build ${{ github.run_number }})" \
            --notes-file notes.md
